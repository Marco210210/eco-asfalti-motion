  <!-- FAQ structured data (schema.org FAQPage) for AEO / rich results -->
  <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "Che tipo di conglomerati bituminosi producete?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "La produzione è il nostro core business. Realizziamo conglomerati di base, binder, miscele di usura e drenanti, con particolare attenzione ai prodotti ecologici CAM e ai conglomerati certificati ReMade."
      }
    },
    {
      "@type": "Question",
      "name": "Producete materiali per i CAM Strade?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Sì. La gamma comprende miscele con materie prime secondarie per i progetti che richiedono i Criteri Ambientali Minimi. Il contenuto riciclato delle miscele ReMade è certificato e consultabile nei PDF della sezione Certificazioni."
      }
    },
    {
      "@type": "Question",
      "name": "Quanto materiale riciclato contengono i prodotti ReMade?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Le otto miscele certificate ReMade contengono dal 16% al 45% di materiale riciclato. Le percentuali di ogni prodotto sono riportate nel certificato 1591/001, disponibile nella sezione Certificazioni."
      }
    },
    {
      "@type": "Question",
      "name": "Come evolve l’impianto dal punto di vista ambientale?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "La transizione ecologica comprende il passaggio dei forni dal combustibile BTZ al GPL, insieme al recupero del fresato e all’impiego di materie prime secondarie nei nuovi conglomerati."
      }
    },
    {
      "@type": "Question",
      "name": "Vi occupate anche del recupero del fresato?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Sì. Il recupero del conglomerato bituminoso alimenta il nostro ciclo produttivo. La capacità massima autorizzata dall’AUA n. 137/2026 è di 97.860 tonnellate all’anno. Contattaci per organizzare un conferimento."
      }
    },
    {
      "@type": "Question",
      "name": "Dove posso consultare le certificazioni?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Nella sezione Certificazioni puoi aprire i PDF ReMade, delle certificazioni dei sistemi di gestione e dell’attestazione SOA. È disponibile anche un collegamento al registro pubblico AGCM per la consultazione del Rating di Legalità."
      }
    },
    {
      "@type": "Question",
      "name": "Eseguite anche lavori di pavimentazione?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Sì. L’esecuzione di pavimentazioni e la manutenzione stradale completano la filiera come attività complementari alla produzione di conglomerati bituminosi e al recupero dei rifiuti."
      }
    },
    {
      "@type": "Question",
      "name": "Dove si trova l’impianto e come richiedo una fornitura?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Siamo in Via Alveo Santa Croce 46, 84015 Nocera Superiore (SA). Puoi compilare il modulo Contatti o scrivere a info@ecoasfalti.it indicando materiale, quantità indicative e luogo di consegna."
      }
    }
  ]
}
