      { "@type": "Question", "name": "Che tipo di conglomerati bituminosi producete?", "acceptedAnswer": { "@type": "Answer", "text": "Produciamo conglomerati di base, binder di collegamento, usura con bitume tal quale o modificato, usura SMA con bitume modificato, usura drenante e materiali CAM." } },
