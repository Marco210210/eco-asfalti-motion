<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pagina non trovata | Eco Asfalti SRL</title>
  <meta name="description" content="La pagina richiesta non è disponibile. Torna al sito Eco Asfalti SRL." />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0c0c0e" />
  <script src="./theme-init.js"></script>
  <link id="page-icon" rel="icon" href="./favicon.ico" sizes="any" />
  <link id="page-touch-icon" rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
  <style>
    *{box-sizing:border-box;margin:0}body{min-height:100svh;display:grid;place-items:center;padding:1.25rem;background:#0c0c0e;color:#f4f2ee;font-family:Inter,system-ui,sans-serif}.box{width:min(100%,760px);padding:clamp(1.5rem,6vw,4rem);border:1px solid rgba(255,255,255,.12);border-radius:24px;background:#17171b}.logo{display:block;width:clamp(82px,15vw,112px);height:auto;margin-bottom:2rem;filter:drop-shadow(0 10px 22px rgba(0,0,0,.4))}.code{color:#ff5c1a;font-weight:900;letter-spacing:.18em;text-transform:uppercase}h1{margin-top:1rem;font-size:clamp(2.6rem,9vw,5.5rem);line-height:1;letter-spacing:-.055em}p{max-width:55ch;margin-top:1.2rem;color:#aaa7a1;line-height:1.7}.actions{display:flex;flex-wrap:wrap;gap:.8rem;margin-top:2rem}a{display:inline-flex;justify-content:center;padding:.85rem 1.35rem;border:1px solid #ff5c1a;border-radius:999px;background:#ff5c1a;color:#0c0c0e;font-weight:800;text-decoration:none}a.secondary{border-color:rgba(255,255,255,.16);background:transparent;color:#f4f2ee}@media(max-width:520px){.actions,a{width:100%}}
  </style>
</head>
<body>
  <main class="box">
    <img id="brand-logo" class="logo" src="/images/eco-asfalti-logo.png" width="668" height="589" alt="Eco Asfalti SRL" />
    <p class="code">Errore 404</p>
    <h1>Questa strada non porta da nessuna parte.</h1>
    <p>La pagina potrebbe essere stata spostata oppure l’indirizzo non è corretto.</p>
    <div class="actions">
      <a id="home-link" href="/">Torna alla homepage</a>
      <a id="contact-link" class="secondary" href="/#contatti">Contattaci</a>
    </div>
  </main>
  <script>
    (function () {
      var parts = window.location.pathname.split('/').filter(Boolean);
      var home = window.location.hostname.endsWith('github.io') && parts.length ? '/' + parts[0] + '/' : '/';
      document.getElementById('home-link').href = home;
      document.getElementById('contact-link').href = home + '#contatti';
      document.getElementById('brand-logo').src = home + 'images/eco-asfalti-logo.png';
      document.getElementById('page-icon').href = home + 'favicon.ico';
      document.getElementById('page-touch-icon').href = home + 'apple-touch-icon.png';
    }());
  </script>
</body>
</html>
